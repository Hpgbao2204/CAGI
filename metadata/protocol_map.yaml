  - name: "Multichain (AnySwap) Router V6"
    chains: ["arbitrum"]
    contract_addresses:
      arbitrum: "0x650af55d5877f289837c30b94af91538a7504b76"  # xac nhan qua tx that goi anySwapOutNative(address token, address to, uint256 toChainID) tu vi Chibi Finance exploiter (0x80c1ca8f..., block 105369813, 400 ETH) - chu ky ham dac trung Multichain/AnySwap, khop voi bao cao CertiK "400 ETH via Multichain", khong phai tu memory. LUU Y: Multichain protocol ngung hoat dong tu giua 2023 (sau vu bat giu CEO) - contract van ton tai tren-chain nhung khong con dang tin cay/hoat dong, chi dung de doi chieu lich su, KHONG dung lam bridge route cho du lieu moi.
    linking_evidence: "onchain_function_signature_confirmed (anySwapOutNative)"
    verify_status: "verified_onchain_2026-08-14"

  - name: "BSC Token Hub"
    chains: ["bsc"]
    contract_addresses:
      bsc: "0x0000000000000000000000000000000000001004"  # system contract công khai trên BscScan (label "BSC: Token Hub"), xác nhận qua 2 internal tx thật gửi ĐÚNG 1,000,000 BNB mỗi lần (tổng 2,000,000 BNB, khớp CHÍNH XÁC báo cáo công khai Halborn/Elliptic) tới ví attacker, block 0x14f0ca1/0x14f1716 (2022-10-06), không phải từ memory
    linking_evidence: "onchain_exact_amount_match_public_report"
    verify_status: "verified_onchain_2026-08-13"

  - name: "Multichain (AnySwap) Router V4 (legacy, 2023)"
    chains: ["bsc"]
    contract_addresses:
      bsc: "0xd1c5966f9f5ee6881ff6b261bbeda45972b1b5f3"  # "Multichain: Router V4" - xac nhan qua BscScan label doc lap 2026-08-14. Xac nhan qua on-chain that: seed circulate_2023 exploiter (0x5695ef5f...) goi external call (value=0) toi day ngay truoc khi gui ETH/anyETH (block 24716329/24716393, 2023-01-12), khop mo ta CertiK "Bridge mechanism: Multichain Router". LUU Y: cung gioi han voi anyETH Token ben duoi - external call gia tri=0 bi decode_bsctrace_transfer_row bo qua, chua kich hoat duoc bridge_deposit tu dong.
    linking_evidence: "onchain_call_pattern_confirmed (CirculateBUSD-CirculateWBNB)"
    verify_status: "verified_onchain_2026-08-14"

  - name: "Multichain (AnySwap) anyETH Token (legacy, 2021)"
    chains: ["bsc"]
    contract_addresses:
      bsc: "0x6f817a0ce8f7640add3bc0c1c2298635043c2423"  # "Anyswap: anyETH Token" - xac nhan qua BscScan token label doc lap 2026-08-14. Gui anyETH VE CHINH contract nay la co che "burn to bridge" cua kien truc AnySwap doi dau (2021), KHAC dia chi Multichain Router V6 (2023) da them o Chibi Finance. Xac nhan qua on-chain that: seed Wault.Finance exploiter (0x886358f9...) gui anyETH ve day 3 lan ngay sau khi swap ETH->anyETH qua 0x146cd24d..., khop mo ta SlowMist "exchanged ETH for anyETH and then cross-chained".
    linking_evidence: "onchain_self_transfer_burn_pattern_confirmed (Wault.Finance)"
    verify_status: "verified_onchain_2026-08-14"

  - name: "LI.FI Diamond"
    chains: ["bsc", "arbitrum"]
    contract_addresses:
      bsc: "0x1231deb6f5749ef6ce6943a275a1d3e7486f4eae"  # LI.FI: LiFi Diamond (EIP-2535 diamond proxy, cross-chain swap+bridge aggregator, cung dia chi tren nhieu chain qua CREATE2) - xac nhan qua BscScan/Etherscan/Cronos Explorer label doc lap 2026-08-14 (KHONG phai tu memory). Xac nhan qua on-chain that: seed UtopiaSphere exploiter (0x6e12ce08...) gui 11 lan native BNB (tong ~1071.5 BNB) toi dia chi nay ngay sau khi rut can pool - khop pattern "swapped for 147.6 ETH and bridged to Ethereum" theo bao cao CertiK.
      arbitrum: "0x1231deb6f5749ef6ce6943a275a1d3e7486f4eae"  # CUNG dia chi qua CREATE2 - xac nhan rieng qua Arbiscan getsourcecode 2026-08-27 (ContractName=LiFiDiamond). Xac nhan qua on-chain that: seed Radiant Capital exploiter (0x0629b1048298...) gui 56 lan ETH toi dia chi nay (bridge_deposit that, xem golden fixture radiant_capital_arbitrum_2024_events.golden.json).
    linking_evidence: "onchain_repeated_transfer_pattern_confirmed (UtopiaSphere)"
    verify_status: "verified_onchain_2026-08-14"

  - name: "Across Protocol SpokePool (Arbitrum)"
    chains: ["arbitrum"]
    contract_addresses:
      arbitrum: "0xe35e9842fceaca96570b734083f4a58e8f7c5f2a"  # xác nhận qua tx thật gọi depositV3(address depositor, address recipient, address inputToken,...) - chữ ký hàm đặc trưng của Across Protocol SpokePool, thấy trực tiếp trong txlist thật của ví DeltaPrime exploiter (block 273316631, 2.967 WBTC), không phải từ memory
    linking_evidence: "onchain_function_signature_confirmed (depositV3)"
    verify_status: "verified_onchain_2026-08-13"

