    chains: ["bsc"]
    contract_addresses:
      bsc: "0xa07c5b74c9b40447a954e1466938b865b6bbea36"  # vBNB Token — xác nhận qua BscScan token label "Venus: vBNB Token" + đối chiếu độc lập qua Blockscan/Bitquery explorer 2026-08-13 (KHÔNG phải từ memory). Địa chỉ này xuất hiện trực tiếp trong raw data thật của seed bsc_token_hub_2022 (0x489a8756...): 3 tx external BNB gửi tới đây (600,000 + 300,000 + 0.1 = 900,000.1 BNB) kèm vBNB mint về đúng seed cùng tx_hash — khớp CHÍNH XÁC "900,000 BNB" báo cáo Elliptic.
