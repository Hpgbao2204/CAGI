# Canonical event schema and prefix features (documentation; implementation
# in src/normalize/schema.py and src/features/extractor.py).

event_schema:
  required: [chain_id, block_number, timestamp, tx_hash, log_index, src, dst, event_type, amount_norm]
  optional: [protocol, token, counterparty_type, source_confidence]
  event_type: [transfer, swap, bridge_deposit, bridge_withdraw, lending_deposit, lending_withdraw,
               split, merge, mixer_or_exit, other]
  amount_norm: log(1 + raw amount)

feature_groups:            # 37 model inputs, computed from actions a_1..a_k only
  flat:                    # what a type-agnostic transaction graph offers (14)
    temporal: [inter_action_gap_mean, inter_action_gap_std, burstiness, active_duration_sec]
    structural: [fan_out, fan_in, unique_counterparties, local_ego_density, path_depth, branch_count]
    economic: [log_amount_mean, outgoing_incoming_ratio, value_retention, token_category_diversity]
  typed_action:            # needs the semantic decoder (16)
    - action_count_<type>_ratio for the 10 event types
    - [num_distinct_bigrams, num_distinct_trigrams, num_bridge_families, swap_after_bridge,
       stablecoin_pivot, time_to_first_bridge]
  motif:                   # counted only when complete inside the prefix (7)
    - [motif_split, motif_merge, motif_peel_like_chain, motif_bridge_then_swap,
       motif_swap_then_split, motif_nested_bridge, motif_rapid_token_pivot]

not_model_inputs:
  - prefix_len and raw action counts (they sum to k and act as a length shortcut)
  - k / n (uses the final length n: future leak, removed; see tests/test_no_future_leakage.py)
  - mixer/exit context features (they reveal the endpoint)
