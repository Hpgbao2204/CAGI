# Detectors evaluated in the paper (documentation; implementations in
# src/models/baselines.py and src/models/sequence.py).

baselines:
  B0: prevalence (training positive rate)
  B1: hand-weighted typology score over motif counts, no training
  B2: logistic regression on action-type shares (bag of actions)
  B3: random forest (200 trees, depth 8, balanced) on the 14 flat features
  B3p: XGBoost with M1's exact settings on the 14 flat features (same learner, different representation)
  S1: GRU over the last 64 typed action tokens (type x log-gap bucket)

primary_model:
  M1:
    learner: XGBoost
    params: {n_estimators: 200, max_depth: 4, learning_rate: 0.1, random_state: 42}
    class_weight: scale_pos_weight = n_neg / n_pos on the training fold
    features: all 37 prefix features (flat + typed actions + motifs)
    coverage_filter: drop features present in fewer than 2 positive incidents of the training fold
    calibration: Platt scaling fitted on inner leave-one-incident-out scores of the training fold
    explanation: exact TreeSHAP contributions of the uncalibrated model

protocol:
  split: leave-one-incident-out (group = incident + its hard negatives)
  pooling: one row per (trajectory, prefix length) across checkpoints
  uncertainty: incident-level bootstrap, 2000 resamples, seed 42
  paired_test: two-sided p = 2 * min(P[d <= 0], P[d >= 0])
  tuning: none (hyperparameters fixed before evaluation)
