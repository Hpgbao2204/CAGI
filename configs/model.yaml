# Model & baseline registry — xem research_questions.md

baselines:
  B0: {name: majority_prevalence, purpose: "sanity check metric tối thiểu"}
  B1: {name: rule_based_typology_score, purpose: "baseline dễ giải thích, không học"}
  B2: {name: bag_of_actions_logistic_regression, purpose: "đo giá trị sequence count đơn giản"}
  B3: {name: flat_graph_rf_xgboost, purpose: "baseline graph không typed semantics"}

primary_model:
  M1:
    name: typed_temporal_motif_xgboost_or_rf
    purpose: "mô hình chính, RQ1"
    # 2026-08-28: loại 9 cột "bridge_context" khỏi feature set CHÍNH THỨC
    # của M1 sau khi ablation trên 15 incident xác nhận gây hại có ý nghĩa
    # thống kê (paired diff +0.0638, 95% CI [+0.0101,+0.1501], p=0.036 khi
    # thêm lại) — hiệu ứng overfitting theo protocol, khuếch đại bởi N (xem
    # results/reports/bridge_context_ablation_investigation.md). Cấu hình
    # này khớp ĐÚNG code chính thức: src/models/baselines.py::
    # BRIDGE_CONTEXT_COLS_EXCLUDED + M1TypedTemporalMotifModel._candidate_columns()
    # (tham số include_bridge_context=False mặc định — chỉ bật True cho
    # mục đích ablation/investigation, KHÔNG dùng cho M1 chính thức).
    # 9 cột đã loại ở dataset schema (vẫn CÓ trong features_v2.parquet ở
    # mức dataset — cột không bị xoá khỏi dữ liệu, chỉ bị loại khỏi tập
    # candidate feature MÀ RIÊNG M1 chọn để fit; các model khác (B1 dùng
    # motif_bridge_then_swap/num_bridge_families/swap_after_bridge trong
    # rule score) KHÔNG bị ảnh hưởng):
    excluded_feature_columns:
      - time_to_first_bridge
      - action_count_bridge_deposit
      - action_count_bridge_deposit_ratio
      - action_count_bridge_withdraw
      - action_count_bridge_withdraw_ratio
      - num_bridge_families
      - swap_after_bridge
      - motif_bridge_then_swap
      - motif_nested_bridge

optional_models:
  M2: {name: small_mlp_or_contrastive_encoder, gate: "chỉ qua data gate contrastive (>=100 positive trajectory độc lập)"}
  N1: {name: markov_ngram_next_event, purpose: "baseline RQ3"}
  N2: {name: multinomial_logistic_or_gbm_next_event, gate: ">=1000 transitions, >=30 mẫu/class, majority <60%"}

threshold_policy:
  metric: "FPR<=1% hoặc max 10 false alerts/1000 trajectories"
  chosen_on: validation_only
  test_evaluated: once_after_freeze

hyperparameter_search:
  strategy: small_fixed_grid
  no_wide_tuning: true
