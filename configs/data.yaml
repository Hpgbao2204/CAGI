# Data collection and trajectory-building settings (read by
# src/trajectories/builder.py::load_trajectory_config).

chains: [eth, bsc, arbitrum]

# Verified protocol contracts (metadata/protocol_map.yaml). Actions to or from
# them are always kept regardless of value share, and the builder never
# expands THROUGH them (shared infrastructure).
bridge_allowlist:
  - "0x1a2a1c938ce3ec39b6d47113c7955baa9dd454f2"  # Ronin Bridge (eth)
  - "0x0000000000000000000000000000000000001004"  # BSC Token Hub (bsc)
  - "0x1231deb6f5749ef6ce6943a275a1d3e7486f4eae"  # LI.FI Diamond (bsc)
  - "0x6f817a0ce8f7640add3bc0c1c2298635043c2423"  # Multichain (AnySwap) anyETH Token, legacy 2021 (bsc)
  - "0x3ee18b2214aff97000d974cf647e7c347e8fa585"  # Wormhole Token Bridge (Portal) (eth)
  - "0x8731d54e9d02c286767d56ac03e8037c07e01e98"  # Stargate (LayerZero) (eth)
  - "0xbf22f0f184bccbea268df387a49ff5238dd23e40"  # Stargate (LayerZero) ETH Router (arbitrum)
  - "0x650af55d5877f289837c30b94af91538a7504b76"  # Multichain (AnySwap) Router V6 (arbitrum)
  - "0xe35e9842fceaca96570b734083f4a58e8f7c5f2a"  # Across Protocol SpokePool (arbitrum)

dex_allowlist:
  - "0x7a250d5630b4cf539739df2c5dacb4c659f2488d"  # Uniswap V2 (eth)
  - "0x10ed43c718714eb63d5aa57b78b54704e256024e"  # PancakeSwap V2 (bsc)
  - "0xe592427a0aece92de3edee1f18e0157c05861564"  # Uniswap V3 SwapRouter (eth)
  - "0x1111111254fb6c44bac0bed2854e76f90643097d"  # 1inch v4 AggregationRouter (eth)
  - "0x88e6a0c2ddd26feeb64f039a2c41296fcb3f5640"  # Uniswap V3: USDC 3 (pool, eth)
  - "0xdef171fe48cf0115b1d80b88dc8eab59176fee57"  # Velora v5: Augustus Swapper / ParaSwap (bsc)

mixer_allowlist:
  - "0xd90e2f925da726b50c4ed8d0fb90ad053324f31b"  # Tornado Cash Router (eth)
  - "0x0d5550d52428e7e3175bfc9550207e4ad3859b17"  # TornadoProxyLight (bsc)

lending_allowlist:
  - "0xa07c5b74c9b40447a954e1466938b865b6bbea36"  # Venus: vBNB Token (bsc)

trajectory:
  max_depth: 6               # hop bound inside the builder
  expand_iterations: 2       # frontier expansion rounds, SAME for incidents and negatives
  time_horizon_hours: 72      # H: window after the first action
  min_tainted_share: 0.05     # eta: keep an outgoing action if >= 5% of its source's outflow (per token)

incident_source:
  candidates_csv: metadata/incident_candidates_amlguard.csv  # candidate seeds only, never used as ground truth
  ground_truth: self_annotated

explorer_api:
  rate_limit_per_sec: 2
  cache_dir: data/raw
